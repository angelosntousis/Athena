program: train_mlp.py
name: mlp_sweep
method: grid
metric:
  goal: maximize
  name: accuracy
parameters:
  dropout_rate: 
    values: [0.1, 0.5]
  hidden_layers:
    values: [1, 2]
  hidden_dim: 
    values: [128, 256]
  representation: 
    values: ['tf-idf', 'tf-idf-bigrams-nb', 'bow', 'token_indicators']
  tokenizer:
    values: ['bpe32k']
  learning_rate: 
    values: [1e-4]
  batch_size: 
    values: [64, 128]
  weight_decay: 
    values: [1e-4]
  save_models:
    value: false
