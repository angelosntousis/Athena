program: train_mlp.py
name: final_mlp_2x256_bow
method: grid
metric:
  goal: maximize
  name: accuracy
# best 2x256 run for bow: tt175mu7 in sweep v4vnnbf7
parameters:
  tokenizer:
    value: bpe32k
  representation:
    value: bow
  hidden_layers:
    value: 2
  hidden_dim:
    value: 256
  dropout_rate:
    value: 0.5
  learning_rate:
    value: 1e-4
  batch_size:
    value: 128
  weight_decay:
    value: 1e-4
  # one run per split seed (5 folds each); seed 0 is already done (tt175mu7)
  split_seeds:
    values: [3, 5]
